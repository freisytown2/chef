<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <!-- Chef Hat -->
  <g filter="url(#shadow)">
    <!-- Base band -->
    <rect x="36" y="80" width="56" height="16" rx="4" fill="#ffffff"/>
    <rect x="40" y="84" width="48" height="2" rx="1" fill="#fdba74"/>
    <!-- Hat puffs -->
    <path d="M 38 80 C 26 78 22 56 38 46 C 36 34 50 26 64 28 C 78 26 92 34 90 46 C 106 56 102 78 90 80 Z" fill="url(#hatGrad)"/>
    <!-- Fold details -->
    <path d="M 48 50 Q 52 74 54 80" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 64 42 Q 64 72 64 80" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 80 50 Q 76 74 74 80" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Sparkle stars -->
  <path d="M 28 32 L 30 26 L 36 28 L 30 30 Z" fill="#fef08a"/>
  <path d="M 98 34 L 102 28 L 106 32 L 100 36 Z" fill="#fef08a"/>
</svg>
